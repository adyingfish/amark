name: Release
on:
  workflow_dispatch:
    inputs:
      test_windows_upgrade:
        type: boolean
        description: Test a fresh installation and an upgrade from Tauri 0.1.1
        default: false

jobs:
  package:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--win --x64"
            artifact: windows-x64
          - os: ubuntu-22.04
            args: "--linux --x64"
            artifact: linux-x64
          - os: macos-latest
            args: "--mac --x64"
            artifact: mac-x64
          - os: macos-latest
            args: "--mac --arm64"
            artifact: mac-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run desktop:test
      - run: bun run desktop:build
      - run: bun run electron-builder ${{ matrix.args }} --publish never
      - name: Check out the old Windows installer source
        if: runner.os == 'Windows' && inputs.test_windows_upgrade
        uses: actions/checkout@v7
        with:
          ref: 8db599e9a0f3b3961b14e5e1beced8e6dac80263
          path: previous-amark
      - name: Build the Tauri 0.1.1 baseline
        if: runner.os == 'Windows' && inputs.test_windows_upgrade
        working-directory: previous-amark
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run tauri build
      - name: Check Windows installation and upgrade
        if: runner.os == 'Windows' && inputs.test_windows_upgrade
        shell: pwsh
        run: |
          $current = (Get-Item release/*-x64-setup.exe).FullName
          $previous = (Get-Item previous-amark/src-tauri/target/release/bundle/nsis/*_x64-setup.exe).FullName
          ./build/test-windows-upgrade.ps1 -InstallerPath $current -PreviousInstallerPath $previous
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.deb

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="app-v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
            gh release upload "$tag" packages/* --clobber
          else
            gh release create "$tag" packages/* --draft --target "$GITHUB_SHA" --title "AMark v$version" --notes "Desktop installers for Windows, macOS, and Linux."
          fi
