name: Release
on:
  workflow_dispatch:

jobs:
  package:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--win --x64"
            artifact: windows-x64
          - os: ubuntu-22.04
            args: "--linux --x64"
            artifact: linux-x64
          - os: macos-latest
            args: "--mac --x64"
            artifact: mac-x64
          - os: macos-latest
            args: "--mac --arm64"
            artifact: mac-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: node --test electron/*.test.cjs
      - run: bun run vp build
      - run: bun run electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.deb

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="app-v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
            gh release upload "$tag" packages/* --clobber
          else
            gh release create "$tag" packages/* --draft --target "$GITHUB_SHA" --title "AMark v$version" --notes "Desktop installers for Windows, macOS, and Linux."
          fi
